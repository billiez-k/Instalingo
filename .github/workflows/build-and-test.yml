name: Build & Firebase Test Lab

on:
  push:
    branches: [main, master, v4]
  workflow_dispatch:

jobs:
  analyze-and-build:
    name: Analyze & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: flutter doctor --verbose 2>&1 | head -10

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  firebase-test-lab:
    name: Firebase Test Lab — Robo Test
    runs-on: ubuntu-latest
    needs: analyze-and-build
    timeout-minutes: 30

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: instalingo-test

      - name: Enable required APIs
        run: |
          gcloud services enable toolresults.googleapis.com --project=instalingo-test 2>/dev/null || true
          gcloud services enable testing.googleapis.com --project=instalingo-test 2>/dev/null || true

      - name: Run Robo test on Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --type robo \
            --app app-release.apk \
            --device model=oriole,version=33 \
            --device model=panther,version=33 \
            --timeout 10m \
            --results-dir=gh-actions-${{ github.run_id }} \
            --project instalingo-test

      - name: Print results link
        if: always()
        run: |
          echo "Firebase Test Lab results:"
          echo "https://console.firebase.google.com/project/instalingo-test/testlab"
