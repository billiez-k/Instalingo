name: instalingo
description: Discover Japanese vocabulary through addictive swipe — TikTok for word learning.
version: 2.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Icons (NO emojis — Phosphor only)
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.10

  # Animations
  animations: ^2.0.11
  lottie: ^3.1.0
  shimmer: ^3.0.0
  confetti: ^0.7.0

  # Images
  cached_network_image: ^3.3.1

  # Audio
  flutter_tts: ^4.2.2

  # Ads (free tier monetization)
  google_mobile_ads: ^5.1.0

  # Subscriptions (premium monetization)
  purchases_flutter: ^8.1.0

  # Analytics
  firebase_core: ^2.27.0
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.0

  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.2
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^17.2.0

  # Social Sharing
  share_plus: ^9.0.0

  # UI Utils
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.2.6
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  http: ^1.2.1

  # Swipe Cards
  flutter_card_swiper: ^7.2.0

  flutter_localizations:
    sdk: flutter

dependency_overrides:
  phosphor_flutter:
    path: vendor/phosphor_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/audio/
    - instalingo_content/japanese/n5/
    - instalingo_content/japanese/n4/
    - instalingo_content/japanese/n3/
    - instalingo_content/japanese/n2/
    - instalingo_content/japanese/n1/
    - instalingo_content/shared/
