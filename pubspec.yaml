name: instalingo
description: Discover Japanese vocabulary through addictive swipe — TikTok for word learning.
version: 2.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.10
  animations: ^2.0.11
  lottie: ^3.1.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  shared_preferences: ^2.3.4
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^9.0.0
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.2.6

dependency_overrides:
  phosphor_flutter:
    path: vendor/phosphor_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/audio/
    - instalingo_content/japanese/n5/
    - instalingo_content/japanese/n4/
    - instalingo_content/japanese/n3/
    - instalingo_content/japanese/n2/
    - instalingo_content/japanese/n1/
    - instalingo_content/japanese/slang/
    - instalingo_content/japanese/vulgar/
    - instalingo_content/japanese/grammar/
